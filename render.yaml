services:
  - type: web
    name: AlexaMusic
    env: python
    plan: free
    buildCommand: pip3 install --no-cache-dir --upgrade --requirement requirements.txt
    startCommand: bash start
    envVars:
      - key: API_ID
        sync: false

      - key: API_HASH
        sync: false

      - key: BOT_TOKEN
        sync: false

      - key: STRING_SESSION
        sync: false

      - key: MONGO_DB_URL
        sync: false

      - key: OWNER_ID
        sync: false

      - key: LOG_GROUP_ID
        sync: false

      - key: MUSIC_BOT_NAME
        sync: false

      - key: PYTHON_VERSION
        value: 3.12.11

      - key: PORT
        value: "10000"

      
        
